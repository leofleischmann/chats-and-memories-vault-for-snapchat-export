services:
  # -------------------------------------------------------------------
  # Start without cloning the repo (only docker-compose.yml + .env):
  #
  # 1) Create a folder (any name) and copy into it:
  #    - docker-compose.yml
  #    - .env (optional, but recommended for keys/passwords)
  #
  # 2) Place these folders next to it (bind-mount targets; Docker usually creates
  #    them if missing, but they are the “persistent storage” for your data):
  #    - ./input        (unpacked export / raw_export)
  #    - ./input_zip    (ZIPs, optional)
  #    - ./data         (SQLite + app data)
  #    - ./logs         (optional, only if LOG_TO_FILES=1)
  #    - ./immich-data  (only relevant if you use the Immich profile)
  #
  # 3) Start:
  #    - Without Immich: docker compose up -d
  #    - With Immich (CPU): docker compose --profile immich up -d
  #    - With Immich (GPU): docker compose --profile immich-gpu up -d
  #
  # 4) Open the app: http://localhost:5173
  #
  # Optional: pin versions via .env
  #    BACKEND_TAG=1.0.3
  #    FRONTEND_TAG=1.0.3
  # -------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  backend:
    image: ghcr.io/leofleischmann/chats-and-memories-vault-for-snapchat-export/backend:${BACKEND_TAG:-latest}
    environment:
      - EXPORT_ROOT=/data/raw_export
      - DATA_DIR=/data
      - SQLITE_PATH=/data/app.sqlite
      - MEILI_URL=http://meilisearch:7700
      - MEILI_API_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_INDEX=messages
      - IMMICH_URL=http://immich-server:2283
      - IMMICH_ADMIN_EMAIL=${IMMICH_ADMIN_EMAIL:-admin@snapchats.local}
      - IMMICH_ADMIN_PASSWORD=${IMMICH_ADMIN_PASSWORD:-snapchats-admin-2026}
      # optional logging to ./logs (activate via .env)
      - LOG_TO_FILES=${LOG_TO_FILES:-0}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LOG_CONSOLE_LEVEL=${LOG_CONSOLE_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-/logs}
      - LOG_FILE_NAME=${LOG_FILE_NAME:-logs.log}
    ports:
      - "8000:8000"
    volumes:
      # raw export + chat_media (writable: web dashboard can unpack ZIPs)
      - ./input:/data/raw_export
      # optional file logs (activate via LOG_TO_FILES=1)
      - ./logs:/logs
      # ZIP export sources
      - ./input_zip:/data/input_zip:ro
      - ./data:/data
      # allow web dashboard to fully reset Immich (deletes this folder)
      - ./immich-data:/data/immich_host
    depends_on:
      - meilisearch

  frontend:
    image: ghcr.io/leofleischmann/chats-and-memories-vault-for-snapchat-export/frontend:${FRONTEND_TAG:-latest}
    ports:
      # Keep the old default port for convenience.
      - "5173:80"
    depends_on:
      - backend

  # --------------- Immich (opt-in via --profile immich) ---------------

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2.6.1}
    profiles: ["immich", "immich-gpu"]
    volumes:
      - ${UPLOAD_LOCATION:-./immich-data/library}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-postgres}
      - DB_USERNAME=${IMMICH_DB_USERNAME:-postgres}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - DB_HOSTNAME=immich-database
      - REDIS_HOSTNAME=immich-redis
    ports:
      - "2283:2283"
    depends_on:
      - immich-redis
      - immich-database
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2.6.1}${IMMICH_ML_SUFFIX:-}
    profiles: ["immich"]
    volumes:
      - immich_model_cache:/cache
    environment:
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-postgres}
      - DB_USERNAME=${IMMICH_DB_USERNAME:-postgres}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - DB_HOSTNAME=immich-database
      - REDIS_HOSTNAME=immich-redis
    restart: unless-stopped

  immich-machine-learning-gpu:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2.6.1}-cuda
    profiles: ["immich-gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - immich_model_cache:/cache
    environment:
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-postgres}
      - DB_USERNAME=${IMMICH_DB_USERNAME:-postgres}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - DB_HOSTNAME=immich-database
      - REDIS_HOSTNAME=immich-redis
    restart: unless-stopped
    # Server erwartet Host "immich-machine-learning"; mit GPU-Profil heisst der Service sonst nur "immich-machine-learning-gpu"
    networks:
      default:
        aliases:
          - immich-machine-learning

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    profiles: ["immich", "immich-gpu"]
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  immich-database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    profiles: ["immich", "immich-gpu"]
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:-postgres}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:-./immich-data/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

volumes:
  meili_data:
  immich_model_cache:
